services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: novaspins-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - novaspins

  nginx:
    image: nginx:1.27-alpine
    container_name: novaspins-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - novaspins

  mysql:
    image: mysql:8.0
    container_name: novaspins-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: novaspins
      MYSQL_USER: novaspins
      MYSQL_PASSWORD: secret
    volumes:
      - novaspins-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - novaspins

volumes:
  novaspins-mysql:

networks:
  novaspins:
    driver: bridge
